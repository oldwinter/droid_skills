name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run catalog tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Run session navigation tests
        run: python3 -m unittest discover -s test -p 'test_*.py'
